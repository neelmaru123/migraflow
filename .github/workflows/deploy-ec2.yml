name: Deploy to AWS EC2

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== Acquiring deployment lock to prevent race conditions ==="
            exec 200>/tmp/migraflow_deploy.lock
            flock -x 200

            echo "=== Navigating to project directory ==="
            cd /home/ubuntu/migraflow || cd ~/migraflow || cd /home/ubuntu/Migraflow || cd ~/Migraflow
            export COMPOSE_PROJECT_NAME=migraflow

            echo "=== Pulling latest changes from branch: ${{ github.ref_name }} ==="
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard FETCH_HEAD

            echo "=== Pre-building updated Docker images (server stays active during build) ==="
            docker compose build

            echo "=== Seamlessly replacing and recreating containers ==="
            docker compose down --remove-orphans || true
            docker stop migration_platform_postgres migration_platform_api migration_platform_web 2>/dev/null || true
            docker rm -f migration_platform_postgres migration_platform_api migration_platform_web 2>/dev/null || true
            docker rm -f $(docker ps -aq --filter "name=migration_platform") 2>/dev/null || true
            docker compose up -d --force-recreate --remove-orphans

            echo "=== Pruning dangling Docker build cache and images ==="
            docker image prune -f

            echo "=== Verifying running services ==="
            docker compose ps
